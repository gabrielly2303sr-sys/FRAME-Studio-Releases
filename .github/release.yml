changelog:
  exclude:
    labels:
      - ignore-for-release-notes
      - dependencies
      - skip-changelog
  categories:
    - title: "🐛 Correções"
      labels:
        - bug
        - bugfix
        - fix
    - title: "✨ Adicionado"
      labels:
        - feature
        - enhancement
        - added
    - title: "⚡ Melhorias"
      labels:
        - improvement
        - performance
    - title: "🗑️ Removido"
      labels:
        - removed
        - deprecated
    - title: "🧩 Compatibilidade"
      labels:
        - compatibility
        - platform
    - title: "📚 Documentação e manutenção"
      labels:
        - documentation
        - docs
        - chore
    - title: "🔀 Outras alterações"
      labels:
        - "*"

name: Cross-platform test suite

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frame-studio-linux/package-lock.json

      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo "FRAME_FFMPEG_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          echo "FRAME_FFPROBE_PATH=$(command -v ffprobe)" >> "$GITHUB_ENV"

      - name: Prepare FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials.zip"
          $unpack = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $unpack -Force
          $bin = Get-ChildItem $unpack -Directory | ForEach-Object { Join-Path $_.FullName "bin" } | Where-Object { Test-Path (Join-Path $_ "ffmpeg.exe") } | Select-Object -First 1
          if (!$bin) { throw "FFmpeg executable was not found in the downloaded archive." }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin
          "FRAME_FFMPEG_PATH=$(Join-Path $bin 'ffmpeg.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FRAME_FFPROBE_PATH=$(Join-Path $bin 'ffprobe.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        working-directory: frame-studio-linux
        run: npm ci --no-audit --no-fund

      - name: Run full regression suite
        working-directory: frame-studio-linux
        run: npm test

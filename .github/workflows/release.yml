name: Build and publish FRAME Studio

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release tag matches package version
        working-directory: frame-studio-linux
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $tagVersion = $env:RELEASE_TAG.TrimStart('v')
          $packageVersion = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) { throw "Release tag $env:RELEASE_TAG does not match package version $packageVersion." }
      - name: Prepare bundled downloader tools for Windows
        working-directory: frame-studio-linux
        shell: pwsh
        run: |
          $vendor = Join-Path $PWD "vendor\win"
          New-Item -ItemType Directory -Force -Path $vendor | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile (Join-Path $vendor "yt-dlp.exe")
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials.zip"
          $unpack = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $unpack -Force
          $bin = Get-ChildItem $unpack -Directory | ForEach-Object { Join-Path $_.FullName "bin" } | Where-Object { Test-Path (Join-Path $_ "ffmpeg.exe") } | Select-Object -First 1
          if (!$bin) { throw "FFmpeg executable was not found in the downloaded archive." }
          Copy-Item (Join-Path $bin "ffmpeg.exe") $vendor -Force
          Copy-Item (Join-Path $bin "ffprobe.exe") $vendor -Force
          Get-ChildItem $bin -Filter "*.dll" | Copy-Item -Destination $vendor -Force
          $licenses = Join-Path $vendor "licenses"
          $ffmpegLicenses = Join-Path $licenses "ffmpeg"
          New-Item -ItemType Directory -Force -Path $ffmpegLicenses | Out-Null
          Get-ChildItem $unpack -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING|GPL|LGPL|README|AUTHORS|NOTICE)' } | Copy-Item -Destination $ffmpegLicenses -Force
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/yt-dlp/yt-dlp/master/LICENSE" -OutFile (Join-Path $licenses "yt-dlp-LICENSE.txt")
          & (Join-Path $vendor "yt-dlp.exe") --version
          & (Join-Path $vendor "ffmpeg.exe") -version | Select-Object -First 1
      - name: Install dependencies
        working-directory: frame-studio-linux
        run: npm install --no-audit --no-fund
      - name: Build auto-updatable NSIS installer
        working-directory: frame-studio-linux
        run: npm run build:win:installer
      - name: Verify bundled tools are inside the Windows app resources
        shell: pwsh
        working-directory: frame-studio-linux
        run: |
          $toolDir = Join-Path $PWD "dist\win-unpacked\resources\downloader"
          foreach ($tool in @("yt-dlp.exe", "ffmpeg.exe", "ffprobe.exe")) {
            $toolPath = Join-Path $toolDir $tool
            if (!(Test-Path $toolPath)) { throw "Bundled tool missing from app resources: $toolPath" }
          }
          & (Join-Path $toolDir "yt-dlp.exe") --version
          & (Join-Path $toolDir "ffmpeg.exe") -version | Select-Object -First 1
      - name: Verify update metadata
        shell: pwsh
        working-directory: frame-studio-linux
        run: |
          if (!(Test-Path "dist/latest.yml")) { throw "dist/latest.yml was not generated. Check the electron-builder publish configuration." }
          if (!(Get-ChildItem "dist" -Filter "*-Setup-x64.exe" | Select-Object -First 1)) { throw "Windows NSIS installer was not generated." }
      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-assets
          if-no-files-found: error
          path: |
            frame-studio-linux/dist/*-Setup-x64.exe
            frame-studio-linux/dist/*.blockmap
            frame-studio-linux/dist/latest.yml

  build-linux:
    name: Linux AppImage, DEB, and RPM
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm libfuse2
      - name: Prepare bundled downloader tools for Linux
        working-directory: frame-studio-linux
        shell: bash
        run: |
          set -euo pipefail
          vendor="$PWD/vendor/linux"
          mkdir -p "$vendor"
          curl -fsSL --retry 3 "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" -o "$vendor/yt-dlp"
          chmod 0755 "$vendor/yt-dlp"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 3 "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" -o "$tmp/ffmpeg.tar.xz"
          tar -xJf "$tmp/ffmpeg.tar.xz" -C "$tmp"
          ffmpeg_path="$(find "$tmp" -type f -name ffmpeg | head -n 1)"
          ffprobe_path="$(find "$tmp" -type f -name ffprobe | head -n 1)"
          test -n "$ffmpeg_path" && test -n "$ffprobe_path"
          install -m 0755 "$ffmpeg_path" "$vendor/ffmpeg"
          install -m 0755 "$ffprobe_path" "$vendor/ffprobe"
          mkdir -p "$vendor/licenses/ffmpeg"
          find "$tmp" -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'GPL*' -o -iname 'LGPL*' -o -iname 'README*' -o -iname 'AUTHORS*' -o -iname 'NOTICE*' \) -exec cp -f {} "$vendor/licenses/ffmpeg/" \; || true
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/yt-dlp/yt-dlp/master/LICENSE" -o "$vendor/licenses/yt-dlp-LICENSE.txt"
          "$vendor/yt-dlp" --version
          "$vendor/ffmpeg" -version | head -n 1
      - name: Install dependencies
        working-directory: frame-studio-linux
        run: npm install --no-audit --no-fund
      - name: Build Linux packages
        working-directory: frame-studio-linux
        run: npm run build:linux
      - name: Verify bundled tools are inside the Linux app resources
        working-directory: frame-studio-linux
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="dist/linux-unpacked/resources/downloader"
          for tool in yt-dlp ffmpeg ffprobe; do
            test -x "$tool_dir/$tool" || { echo "Bundled tool missing or not executable: $tool_dir/$tool"; exit 1; }
          done
          "$tool_dir/yt-dlp" --version
          "$tool_dir/ffmpeg" -version | head -n 1
      - name: Verify AppImage update metadata
        working-directory: frame-studio-linux
        run: test -s dist/latest-linux.yml
      - name: Upload Linux release files
        uses: actions/upload-artifact@v4
        with:
          name: linux-update-assets
          if-no-files-found: error
          path: |
            frame-studio-linux/dist/*.AppImage
            frame-studio-linux/dist/*.deb
            frame-studio-linux/dist/*.rpm
            frame-studio-linux/dist/latest-linux.yml

  publish-assets:
    name: Attach installers to the GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: windows-update-assets
          path: release-assets/windows
      - name: Download Linux assets
        uses: actions/download-artifact@v4
        with:
          name: linux-update-assets
          path: release-assets/linux
      - name: Upload installers and updater metadata to this release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/windows/*-Setup-x64.exe
            release-assets/windows/*.blockmap
            release-assets/windows/latest.yml
            release-assets/linux/*.AppImage
            release-assets/linux/*.deb
            release-assets/linux/*.rpm
            release-assets/linux/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
